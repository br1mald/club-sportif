{% extends "base.html" %}

{% block title %}Ajouter un membre{% endblock %}
{% block page_title %}Ajouter un membre{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <i class="bi bi-person-plus-fill"></i> Nouveau membre
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('membres.add') }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nom</label>
                            <input type="text" name="nom" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Prénom</label>
                            <input type="text" name="prenom" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date de naissance</label>
                            <input type="date" name="date_naissance" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Téléphone</label>
                            <input type="tel" name="telephone" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date d'adhésion</label>
                            <input type="date" name="date_adhesion" class="form-control" required>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Équipe</label>
                            <select name="code_equipe" class="form-select">
                                <option value="">-- Aucune équipe --</option>
                                {% for equipe in equipes %}
                                    <option value="{{ equipe.code_equipe }}">
                                        {{ equipe.nom }} ({{ equipe.categorie }})
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Enregistrer
                        </button>
                        <a href="{{ url_for('membres.list_membres') }}" class="btn btn-secondary">
                            <i class="bi bi-x-lg"></i> Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
