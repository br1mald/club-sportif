{% extends "base.html" %}

{% block title %}Ajouter un entraînement{% endblock %}
{% block page_title %}Ajouter un entraînement{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <i class="bi bi-plus-circle"></i> Nouvel entraînement
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('entrainements.add') }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Équipe</label>
                            <select name="code_equipe" class="form-select" required>
                                <option value="">-- Choisir une équipe --</option>
                                {% for equipe in equipes %}
                                    <option value="{{ equipe.Code_Equipe }}">
                                        {{ equipe.Nom_Equipe }} ({{ equipe.Categorie }})
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date</label>
                            <input type="date" name="date" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Heure de début</label>
                            <input type="time" name="heure_debut" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Durée (minutes)</label>
                            <input type="number" name="duree" class="form-control"
                                   min="30" max="240" placeholder="90" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Lieu</label>
                            <input type="text" name="lieu" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Thème</label>
                            <input type="text" name="theme" class="form-control"
                                   placeholder="Ex: Tactique offensive" required>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Enregistrer
                        </button>
                        <a href="{{ url_for('entrainements.list_entrainements') }}"
                           class="btn btn-secondary">
                            <i class="bi bi-x-lg"></i> Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
